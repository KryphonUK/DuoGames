    const playTone = (freq = 440, type = 'sine', duration = 0.1) => {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    };

    // --- HAVERSINE GREAT-CIRCLE DISTANCE CALCULATOR (KM) ---
    function getDistanceKm(x1, y1, x2, y2) {
      const toRad = (d) => (d * Math.PI) / 180;
      // Map percentages to Equirectangular coordinates:
      const lon1 = (x1 / 100) * 360 - 180;
      const lat1 = 90 - (y1 / 100) * 180;
      const lon2 = (x2 / 100) * 360 - 180;
      const lat2 = 90 - (y2 / 100) * 180;
      const R = 6371; // Earth's mean radius in km
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a = Math.sin(dLat / 2) ** 2 +
                Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return Math.round(R * c);
    }

          if (peerRef.current) peerRef.current.destroy();
        };
      }, []);

        if (connRef.current && connRef.current.open) {
          connRef.current.send(data);
        }
      };

      const handleIncomingData = (data) => {
        if (data.type === 'START_GAME') {
          setActiveGame(data.game);
          setStatusMsg('');
        } else if (data.type === 'UPDATE_SCORE') {
          setScores(data.scores);
        } else if (data.type === 'RETURN_LOBBY') {
          setActiveGame(null);
        }
      };

        const code = Math.random().toString(36).substring(2, 6).toUpperCase();

        setRole('host');
        setStatusMsg('Connecting to lobby server...');

        const peer = new Peer('duo-' + code);
        peerRef.current = peer;

        peer.on('open', () => {
          setStatusMsg(`Room Created! Share code: ${code}`);
        });

        peer.on('connection', (conn) => {
          connRef.current = conn;
          conn.on('open', () => {
            setConnected(true);
            setStatusMsg('Opponent connected! Choose a game.');
            playTone(600, 'sine', 0.2);
          });
          conn.on('data', handleIncomingData);
        });

        peer.on('error', () => {
          setStatusMsg('Code conflict or connection reset. Please retry.');
        });
      };

        setRole('guest');

            setStatusMsg('Connected to game room!');
            playTone(600, 'sine', 0.2);

    // ==========================================
    // 1. GEOGUESS 2.0 (With Real Km Distance & Comparison)
    // ==========================================
    function GeoGuess({ role, sendData, connRef, addPoint }) {
      const [roundIdx, setRoundIdx] = useState(0);
      const [myPin, setMyPin] = useState(null);
      const [oppPin, setOppPin] = useState(null);
      const [revealed, setRevealed] = useState(false);
      const [roundWinner, setRoundWinner] = useState(null);

      const current = GEO_ROUNDS[roundIdx % GEO_ROUNDS.length];

      useEffect(() => {
        if (!connRef.current) return;
        const handler = (data) => {
          if (data.type === 'GEO_PIN') {
            setOppPin(data.pin);
          } else if (data.type === 'GEO_NEXT') {
            nextRound();
          }
        };
        connRef.current.on('data', handler);
      }, [roundIdx]);

      // Calculate distances once pins are placed
      useEffect(() => {
        if (myPin && (role === 'solo' || oppPin)) {
          setRevealed(true);
          const dMy = getDistanceKm(myPin.x, myPin.y, current.x, current.y);

          if (role === 'solo') {
            setRoundWinner('solo');
          } else if (oppPin) {
            const dOpp = getDistanceKm(oppPin.x, oppPin.y, current.x, current.y);
            if (dMy < dOpp) {
              setRoundWinner('me');
              addPoint(role);
            } else if (dOpp < dMy) {
              setRoundWinner('opp');
              addPoint(role === 'host' ? 'guest' : 'host');
            } else {
              setRoundWinner('tie');
            }
          }
        }
      }, [myPin, oppPin]);

      const handleMapClick = (e) => {
        if (myPin || revealed) return;
        const rect = e.currentTarget.getBoundingClientRect();
        const x = ((e.clientX - rect.left) / rect.width) * 100;
        const y = ((e.clientY - rect.top) / rect.height) * 100;
        setMyPin({ x, y });
        playTone(550, 'sine', 0.1);
        sendData({ type: 'GEO_PIN', pin: { x, y } });
      };

      const nextRound = () => {
        setMyPin(null);
        setOppPin(null);
        setRevealed(false);
        setRoundWinner(null);
        setRoundIdx(r => r + 1);
      };

      const myDist = myPin ? getDistanceKm(myPin.x, myPin.y, current.x, current.y) : null;
      const oppDist = oppPin ? getDistanceKm(oppPin.x, oppPin.y, current.x, current.y) : null;

      return (
        <div className="bg-slate-900 border border-slate-800 p-6 md:p-8 rounded-3xl max-w-4xl mx-auto flex flex-col items-center select-none shadow-2xl">
          <div className="text-center mb-4">
            <span className="text-[11px] uppercase tracking-widest text-indigo-400 font-black">Round {roundIdx + 1} of {GEO_ROUNDS.length}</span>
            <h3 className="text-2xl md:text-3xl font-black text-white mt-1">{current.name}</h3>
            <p className="text-xs text-slate-400 italic mt-0.5">Clue: {current.hint}</p>
          </div>

          {/* SATELLITE MAP CONTAINER */}
          <div 
            onClick={handleMapClick}
            className="relative w-full aspect-[2/1] bg-slate-950 rounded-2xl border-2 border-slate-700/80 overflow-hidden cursor-crosshair shadow-2xl"
          >
            <img 
              src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/83/Equirectangular_projection_SW.jpg/1280px-Equirectangular_projection_SW.jpg"
              alt="World Map"
              referrerPolicy="no-referrer"
              className="w-full h-full object-fill pointer-events-none filter brightness-90 contrast-110 saturate-125"
            />

            {/* Flight Path Lines (SVG Overlay) */}
            {revealed && (
              <svg className="absolute inset-0 w-full h-full pointer-events-none">
                {myPin && (
                  <line 
                    x1={`${myPin.x}%`} y1={`${myPin.y}%`} 
                    x2={`${current.x}%`} y2={`${current.y}%`} 
                    stroke="#6366f1" strokeWidth="2" strokeDasharray="4 4" 
                  />
                )}
                {oppPin && (
                  <line 
                    x1={`${oppPin.x}%`} y1={`${oppPin.y}%`} 
                    x2={`${current.x}%`} y2={`${current.y}%`} 
                    stroke="#f43f5e" strokeWidth="2" strokeDasharray="4 4" 
                  />
                )}
              </svg>
            )}

            {/* Actual Target Pin */}
            {revealed && (
              <>
                <div 
                  className="absolute w-6 h-6 bg-emerald-400 rounded-full -translate-x-1/2 -translate-y-1/2 border-2 border-white shadow-lg animate-ping pointer-events-none"
                  style={{ left: `${current.x}%`, top: `${current.y}%` }}
                />
                <div 
                  className="absolute w-6 h-6 bg-emerald-500 rounded-full -translate-x-1/2 -translate-y-1/2 border-2 border-white shadow-xl pointer-events-none flex items-center justify-center text-xs font-black text-white"
                  style={{ left: `${current.x}%`, top: `${current.y}%` }}
                >
                  ★
                </div>
              </>
            )}

            {/* Player's Pin */}
            {myPin && (
              <div 
                className="absolute w-4 h-4 bg-indigo-500 rounded-full -translate-x-1/2 -translate-y-1/2 border-2 border-white shadow-lg pointer-events-none ring-2 ring-indigo-400/50"
                style={{ left: `${myPin.x}%`, top: `${myPin.y}%` }}
              />
            )}

            {/* Opponent's Pin */}
            {oppPin && revealed && (
              <div 
                className="absolute w-4 h-4 bg-rose-500 rounded-full -translate-x-1/2 -translate-y-1/2 border-2 border-white shadow-lg pointer-events-none ring-2 ring-rose-400/50"
                style={{ left: `${oppPin.x}%`, top: `${oppPin.y}%` }}
              />
            )}
          </div>

          {/* ROUND COMPARISON STATS */}
          {revealed ? (
            <div className="w-full mt-6 bg-slate-950 border border-slate-800 rounded-2xl p-5 space-y-4">
              <div className="grid grid-cols-2 gap-4 text-center">
                <div className="bg-slate-900 border border-indigo-500/30 p-3 rounded-xl">
                  <div className="text-[11px] font-bold text-indigo-400 uppercase">Your Guess</div>
                  <div className="text-2xl font-black text-white mt-0.5">{myDist?.toLocaleString()} <span className="text-xs text-slate-400 font-normal">km away</span></div>
                </div>

                {role !== 'solo' ? (
                  <div className="bg-slate-900 border border-rose-500/30 p-3 rounded-xl">
                    <div className="text-[11px] font-bold text-rose-400 uppercase">Opponent Guess</div>
                    <div className="text-2xl font-black text-white mt-0.5">{oppDist?.toLocaleString()} <span className="text-xs text-slate-400 font-normal">km away</span></div>
                  </div>
                ) : (
                  <div className="bg-slate-900 border border-slate-800 p-3 rounded-xl">
                    <div className="text-[11px] font-bold text-slate-400 uppercase">Proximity</div>
                    <div className="text-2xl font-black text-emerald-400 mt-0.5">{myDist < 500 ? "🎯 Bullseye!" : myDist < 2000 ? "👍 Close" : "🌍 Distant"}</div>
                  </div>
                )}
              </div>

              {role !== 'solo' && (
                <div className="text-center font-bold text-sm">
                  {roundWinner === 'me' ? (
                    <span className="text-emerald-400">🏆 You were closer by {(oppDist - myDist).toLocaleString()} km! (+1 Point)</span>
                  ) : roundWinner === 'opp' ? (
                    <span className="text-rose-400">💥 Opponent was closer by {(myDist - oppDist).toLocaleString()} km!</span>
                  ) : (
                    <span className="text-slate-400">It's a dead heat tie!</span>
                  )}
                </div>
              )}

              <button 
                onClick={() => { nextRound(); sendData({ type: 'GEO_NEXT' }); }}
                className="w-full py-3 bg-gradient-to-r from-indigo-600 to-indigo-500 hover:from-indigo-500 hover:to-indigo-400 rounded-xl font-bold text-sm shadow-lg transition"
              >
                Next Landmark →
              </button>
            </div>
          ) : (
            <div className="mt-4 text-xs font-semibold text-slate-400">
              {!myPin ? "Click anywhere on the satellite map to place your pin" : "Pin locked! Waiting for opponent..."}
            </div>
          )}
        </div>
      );
    }

    // ==========================================

    function AircraftRecon({ role, sendData, connRef, addPoint }) {
      const [idx, setIdx] = useState(0);

      const cur = AIRCRAFT_ROUNDS[idx % AIRCRAFT_ROUNDS.length];

      useEffect(() => {
        if (!connRef.current) return;
        connRef.current.on('data', (d) => {
          if (d.type === 'AIR_ANSWER') setOppPick(d.answer);
          else if (d.type === 'AIR_NEXT') next();
        });
      }, [idx]);

      useEffect(() => {
        if (myPick && (role === 'solo' || oppPick)) {
          setResolved(true);
          const iAmRight = myPick === cur.name;
          const oppRight = oppPick === cur.name;

          if (role !== 'solo') {
            if (iAmRight && !oppRight) addPoint(role);
            else if (oppRight && !iAmRight) addPoint(role === 'host' ? 'guest' : 'host');
          } else if (iAmRight) {
            playTone(800, 'sine', 0.15);
          }
        }
      }, [myPick, oppPick]);

      const choose = (opt) => {
        if (myPick) return;
        setMyPick(opt);
        sendData({ type: 'AIR_ANSWER', answer: opt });
        playTone(500, 'sine', 0.08);
      };

      const next = () => {
        setMyPick(null);
        setOppPick(null);
        setResolved(false);
        setIdx(i => i + 1);
      };

      return (
        <div className="bg-slate-900 border border-slate-800 p-6 md:p-8 rounded-3xl max-w-xl mx-auto space-y-6 shadow-2xl">
          <div className="flex justify-between items-center">
            <span className="text-[11px] font-black uppercase tracking-widest text-indigo-400">Combat Aircraft ID</span>

            <div className="text-5xl">{cur.icon}</div>
            <div className="text-xs font-bold uppercase tracking-wider text-emerald-400">{cur.role}</div>
            <p className="text-xs text-slate-300 leading-relaxed font-mono bg-slate-900/80 p-3 rounded-xl border border-slate-800">
              "{cur.spec}"
            </p>
            <div className="text-[11px] text-slate-500">Country of Origin: <span className="text-slate-300 font-bold">{cur.origin}</span></div>
          </div>

          <div className="grid grid-cols-2 gap-3">
            {cur.options.map((opt, i) => {
              const isCorrect = resolved && opt === cur.name;
              const isMyChoice = myPick === opt;
              const isOppChoice = resolved && oppPick === opt;

              let btnStyle = "bg-slate-950 border-slate-800 hover:border-indigo-500/50 text-slate-200";
              if (isCorrect) btnStyle = "bg-emerald-950/80 border-emerald-500 text-emerald-300";
              else if (isMyChoice && !isCorrect && resolved) btnStyle = "bg-rose-950/80 border-rose-500 text-rose-300";

              return (
                <button
                  key={i}
                  disabled={myPick !== null}
                  onClick={() => choose(opt)}
                  className={`p-4 rounded-xl border-2 font-bold text-sm text-left transition flex justify-between items-center ${btnStyle}`}
                >
                  <span>{opt}</span>
                  {isMyChoice && <span className="text-[10px] bg-indigo-500/20 text-indigo-400 px-1.5 py-0.5 rounded">You</span>}
                  {isOppChoice && <span className="text-[10px] bg-rose-500/20 text-rose-400 px-1.5 py-0.5 rounded">Opp</span>}
                </button>
              );
            })}
          </div>

          {resolved && (
            <div className="space-y-4 pt-2">
              <div className="text-center text-xs font-bold">
                {myPick === cur.name ? (
                  <span className="text-emerald-400">✓ Target Confirmed: {cur.name}!</span>
                ) : (
                  <span className="text-rose-400">✗ Negative! Correct answer: {cur.name}</span>

              </div>
              <button 
                onClick={() => { next(); sendData({ type: 'AIR_NEXT' }); }}
                className="w-full py-3 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-bold text-sm shadow-lg"
              >
                Next Aircraft →
              </button>
            </div>
          )}
        </div>
      );
    }

          <div className="text-center text-xs font-bold text-slate-400">Which military / nation fielded this pattern?</div>

          <div className="grid grid-cols-2 gap-3">
            {cur.options.map((opt, i) => {
              const isCorrect = resolved && opt === cur.nation;
              const isMyChoice = myPick === opt;
              const isOppChoice = resolved && oppPick === opt;

              let btnStyle = "bg-slate-950 border-slate-800 hover:border-indigo-500/50 text-slate-200";
              if (isCorrect) btnStyle = "bg-emerald-950/80 border-emerald-500 text-emerald-300";
              else if (isMyChoice && !isCorrect && resolved) btnStyle = "bg-rose-950/80 border-rose-500 text-rose-300";

              return (
                <button
                  key={i}
                  disabled={myPick !== null}
                  onClick={() => choose(opt)}
                  className={`p-4 rounded-xl border-2 font-bold text-xs text-left transition flex justify-between items-center ${btnStyle}`}
                >
                  <span>{opt}</span>
                  {isMyChoice && <span className="text-[10px] bg-indigo-500/20 text-indigo-400 px-1.5 py-0.5 rounded">You</span>}
                  {isOppChoice && <span className="text-[10px] bg-rose-500/20 text-rose-400 px-1.5 py-0.5 rounded">Opp</span>}
                </button>
              );
            })}
          </div>

          {resolved && (
            <div className="space-y-4 pt-2">
              <div className="text-center text-xs font-bold">
                {myPick === cur.nation ? (
                  <span className="text-emerald-400">✓ Correct Nation: {cur.nation}!</span>
                ) : (
                  <span className="text-rose-400">✗ Incorrect! Issued by: {cur.nation}</span>
                )}
              </div>
              <button 
                onClick={() => { next(); sendData({ type: 'CAMO_NEXT' }); }}
                className="w-full py-3 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-bold text-sm shadow-lg"
              >
                Next Camo Pattern →
              </button>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 5. GUESS THE ERA 2.0 (With Side-by-Side Breakdown)
    // ==========================================
    function GuessEra({ role, sendData, connRef, addPoint }) {
      const [idx, setIdx] = useState(0);
      const [val, setVal] = useState(1960);
      const [myGuess, setMyGuess] = useState(null);
      const [oppGuess, setOppGuess] = useState(null);
      const [show, setShow] = useState(false);

      const cur = ERA_ROUNDS[idx % ERA_ROUNDS.length];

      useEffect(() => {
        if (!connRef.current) return;
        connRef.current.on('data', (d) => {
          if (d.type === 'ERA_GUESS') setOppGuess(d.year);
          else if (d.type === 'ERA_NEXT') next();
        });
      }, [idx]);

      useEffect(() => {
        if (myGuess !== null && (role === 'solo' || oppGuess !== null)) {
          setShow(true);
          const diff1 = Math.abs(myGuess - cur.year);
          if (role !== 'solo') {
            const diff2 = Math.abs(oppGuess - cur.year);
            if (diff1 < diff2) addPoint(role);
            else if (diff2 < diff1) addPoint(role === 'host' ? 'guest' : 'host');
          }
        }
      }, [myGuess, oppGuess]);

      const submit = () => {
        setMyGuess(val);
        sendData({ type: 'ERA_GUESS', year: val });
        playTone(480, 'sine', 0.1);
      };

      const next = () => {
        setMyGuess(null);
        setOppGuess(null);
        setShow(false);
        setIdx(i => i + 1);
      };

      return (
        <div className="bg-slate-900 border border-slate-800 p-6 md:p-8 rounded-3xl max-w-lg mx-auto text-center space-y-6 shadow-2xl">
          <span className="text-[11px] font-black uppercase tracking-widest text-indigo-400">Round {idx + 1} of {ERA_ROUNDS.length}</span>
          <h3 className="text-xl md:text-2xl font-black text-white">{cur.event}</h3>

          <div className="text-6xl font-black font-mono text-indigo-400 py-1">
            {val}
          </div>

          {!show ? (
            <div className="space-y-5">
              <input 
                type="range" 
                min="1890" 
                max="2025" 
                value={val} 
                onChange={(e) => setVal(Number(e.target.value))}
                className="w-full accent-indigo-500 cursor-pointer h-2 bg-slate-950 rounded-lg"
              />
              <button 
                onClick={submit}
                disabled={myGuess !== null}
                className="w-full py-4 bg-indigo-600 hover:bg-indigo-500 disabled:bg-slate-800 rounded-2xl font-bold transition shadow-lg shadow-indigo-600/30"
              >
                {myGuess !== null ? "Locked in! Waiting for opponent..." : "Lock in Year"}
              </button>
            </div>
          ) : (
            <div className="space-y-5">
              <div className="p-5 bg-slate-950 rounded-2xl border border-slate-800">
                <div className="text-[11px] text-slate-500 uppercase font-black">Actual Year</div>
                <div className="text-5xl font-black text-emerald-400 mt-1">{cur.year}</div>

                <div className="grid grid-cols-2 gap-3 mt-4 pt-4 border-t border-slate-800/80">
                  <div className="bg-slate-900 p-2.5 rounded-xl border border-indigo-500/20">
                    <div className="text-[10px] uppercase font-bold text-indigo-400">You Guessed</div>
                    <div className="text-lg font-bold text-white mt-0.5">{myGuess}</div>
                    <div className="text-xs text-slate-400">Off by {Math.abs(myGuess - cur.year)} yrs</div>
                  </div>

                  {role !== 'solo' ? (
                    <div className="bg-slate-900 p-2.5 rounded-xl border border-rose-500/20">
                      <div className="text-[10px] uppercase font-bold text-rose-400">Opponent Guessed</div>
                      <div className="text-lg font-bold text-white mt-0.5">{oppGuess}</div>
                      <div className="text-xs text-slate-400">Off by {Math.abs(oppGuess - cur.year)} yrs</div>
                    </div>
                  ) : (
                    <div className="bg-slate-900 p-2.5 rounded-xl border border-slate-800 flex items-center justify-center text-xs font-bold text-emerald-400">
                      {Math.abs(myGuess - cur.year) === 0 ? "Exact Match! 🎯" : Math.abs(myGuess - cur.year) <= 3 ? "Super Close!" : "Good Try"}
                    </div>
                  )}
                </div>
              </div>

              <button 
                onClick={() => { next(); sendData({ type: 'ERA_NEXT' }); }}
                className="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 rounded-2xl font-bold shadow-lg"
              >
                Next Historical Event →
              </button>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 6. CONNECT 4
    // ==========================================
    function Connect4({ role, sendData, connRef, addPoint }) {
      const ROWS = 6;
      const COLS = 7;
      const [board, setBoard] = useState(Array(ROWS).fill(null).map(() => Array(COLS).fill(null)));
      const [turn, setTurn] = useState('host');
      const [winner, setWinner] = useState(null);

      useEffect(() => {
        if (!connRef.current) return;
        const handler = (data) => {
          if (data.type === 'C4_MOVE') applyMove(data.col, data.playerRole);
          else if (data.type === 'C4_RESET') resetBoard();
        };
        connRef.current.on('data', handler);
      }, [board, turn]);

      const checkWin = (grid, r, c, player) => {
        const dirs = [[0, 1], [1, 0], [1, 1], [1, -1]];
        for (let [dr, dc] of dirs) {
          let count = 1;
          for (let step = 1; step <= 3; step++) {
            let nr = r + dr * step, nc = c + dc * step;
            if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && grid[nr][nc] === player) count++;
            else break;
          }
          for (let step = 1; step <= 3; step++) {
            let nr = r - dr * step, nc = c - dc * step;
            if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && grid[nr][nc] === player) count++;
            else break;
          }
          if (count >= 4) return true;
        }
        return false;
      };

      const applyMove = (col, playerRole) => {
        for (let r = ROWS - 1; r >= 0; r--) {
          if (!board[r][col]) {
            const next = board.map(row => [...row]);
            next[r][col] = playerRole;
            setBoard(next);
            playTone(playerRole === 'host' ? 400 : 550, 'square', 0.08);

            if (checkWin(next, r, col, playerRole)) {
              setWinner(playerRole);
              addPoint(playerRole);
            } else {
              setTurn(playerRole === 'host' ? 'guest' : 'host');
            }
            break;
          }
        }
      };

      const handleColClick = (col) => {
        if (winner) return;
        if (role !== 'solo' && turn !== role) return;

        const currentMover = role === 'solo' ? turn : role;
        applyMove(col, currentMover);
        sendData({ type: 'C4_MOVE', col, playerRole: currentMover });
      };

      const resetBoard = () => {
        setBoard(Array(ROWS).fill(null).map(() => Array(COLS).fill(null)));
        setWinner(null);
        setTurn('host');
      };

      const isMyTurn = role === 'solo' || turn === role;

      return (
        <div className="bg-slate-900 border border-slate-800 p-6 md:p-8 rounded-3xl max-w-lg mx-auto flex flex-col items-center shadow-2xl">
          <div className="flex justify-between w-full mb-4 items-center">
            <span className="text-xs font-bold text-slate-300">
              {winner ? `Winner: ${winner.toUpperCase()}!` : `Turn: ${turn === 'host' ? 'Player 1 (Red)' : 'Player 2 (Yellow)'}`}
            </span>
            <span className={`text-[10px] px-2.5 py-1 rounded-full font-bold uppercase tracking-wider ${isMyTurn ? 'bg-emerald-500/20 text-emerald-400' : 'bg-slate-800 text-slate-500'}`}>
              {winner ? 'GAME OVER' : isMyTurn ? 'YOUR MOVE' : 'WAITING...'}
            </span>
          </div>

          <div className="bg-blue-800 p-3.5 rounded-3xl shadow-2xl grid grid-cols-7 gap-2 border-4 border-blue-900">
            {Array.from({ length: COLS }).map((_, c) => (
              <div 
                key={c} 
                onClick={() => handleColClick(c)} 
                className="flex flex-col gap-2 cursor-pointer group"
              >
                {Array.from({ length: ROWS }).map((_, r) => {
                  const val = board[r][c];
                  return (
                    <div 
                      key={r}
                      className={`w-10 h-10 md:w-12 md:h-12 rounded-full border-2 border-blue-950/60 shadow-inner transition duration-150 ${
                        val === 'host' ? 'bg-rose-500' : val === 'guest' ? 'bg-amber-400' : 'bg-slate-950 group-hover:bg-slate-900'
                      }`}
                    />
                  );
                })}
              </div>
            ))}
          </div>

          {winner && (
            <button 
              onClick={() => { resetBoard(); sendData({ type: 'C4_RESET' }); }}
              className="mt-6 px-6 py-2.5 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-bold text-sm shadow-lg shadow-indigo-600/30"
            >
              Play Again
            </button>
          )}
        </div>
      );
    }

    // ==========================================
    // 7. QUICK DRAW
    // ==========================================
    function QuickDraw({ role, sendData, connRef, addPoint }) {
      const [state, setState] = useState('waiting');
      const [winner, setWinner] = useState(null);
      const timerRef = useRef(null);

      useEffect(() => {
        if (!connRef.current) return;
        connRef.current.on('data', (d) => {
          if (d.type === 'QD_FIRE') setState('fire');
          else if (d.type === 'QD_WIN') { setWinner(d.winner); setState('finished'); }
          else if (d.type === 'QD_RESTART') restart();
        });
      }, []);

      const startDuel = () => {
        setState('ready');
        setWinner(null);
        const delay = 2000 + Math.random() * 3000;
        timerRef.current = setTimeout(() => {
          setState('fire');
          playTone(900, 'sine', 0.15);
          sendData({ type: 'QD_FIRE' });
        }, delay);
      };

      const handleClick = () => {
        if (state === 'ready') {
          clearTimeout(timerRef.current);
          const other = role === 'host' ? 'guest' : 'host';
          setWinner(other);
          setState('finished');
          addPoint(other);
          sendData({ type: 'QD_WIN', winner: other });
        } else if (state === 'fire') {
          playTone(1100, 'square', 0.2);
          setWinner(role);
          setState('finished');
          addPoint(role);
          sendData({ type: 'QD_WIN', winner: role });
        }
      };

      const restart = () => {
        setState('waiting');
        setWinner(null);
      };

      return (
        <div 
          onClick={handleClick}
          className={`h-80 rounded-3xl border-2 flex flex-col items-center justify-center cursor-pointer transition select-none shadow-2xl ${
            state === 'fire' 
              ? 'bg-emerald-500 border-emerald-300 text-slate-950 shadow-emerald-500/50' 
              : state === 'ready' 
              ? 'bg-rose-950/80 border-rose-800 text-rose-300' 
              : 'bg-slate-900 border-slate-800 text-slate-200'
          }`}
        >
          {state === 'waiting' && (
            <div className="text-center space-y-3">
              <div className="text-5xl">⚡</div>
              <h3 className="text-2xl font-black">Reflex Quick Draw</h3>
              <p className="text-xs text-slate-400">Wait for the green light — early click loses!</p>
              <button 
                onClick={(e) => { e.stopPropagation(); startDuel(); }} 
                className="px-6 py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-2xl shadow-lg"
              >
                Start Countdown
              </button>
            </div>
          )}

          {state === 'ready' && (
            <div className="text-center">
              <h3 className="text-4xl font-black tracking-widest uppercase animate-pulse">STEADY...</h3>
              <p className="text-xs mt-2 opacity-80">Do NOT click yet!</p>
            </div>
          )}

          {state === 'fire' && (
            <div className="text-center">
              <h3 className="text-6xl font-black tracking-tighter">FIRE! 🔥</h3>
            </div>
          )}

          {state === 'finished' && (
            <div className="text-center space-y-3">
              <h3 className="text-3xl font-black">{winner === role ? "🏆 YOU WON!" : "💥 OPPONENT WAS FASTER!"}</h3>
              <button 
                onClick={(e) => { e.stopPropagation(); restart(); sendData({ type: 'QD_RESTART' }); }}
                className="px-6 py-2.5 bg-slate-950 text-white border border-slate-800 hover:border-slate-700 font-bold rounded-xl"
              >
                Rematch
              </button>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 8. WORD SCRAMBLE
    // ==========================================
    function WordScramble({ role, sendData, connRef, addPoint }) {
      const [idx, setIdx] = useState(0);
      const [input, setInput] = useState('');
      const [winner, setWinner] = useState(null);

      const cur = SCRAMBLE_WORDS[idx % SCRAMBLE_WORDS.length];
      const scrambled = cur.word.split('').sort(() => 0.5 - Math.random()).join('');

      useEffect(() => {
        if (!connRef.current) return;
        connRef.current.on('data', (d) => {
          if (d.type === 'SCRAMBLE_WIN') setWinner(d.winner);
          else if (d.type === 'SCRAMBLE_NEXT') next();
        });
      }, [idx]);

      const handleSubmit = (e) => {
        e.preventDefault();
        if (winner) return;
        if (input.trim().toUpperCase() === cur.word) {
          playTone(950, 'sine', 0.2);
          setWinner(role);
          addPoint(role);
          sendData({ type: 'SCRAMBLE_WIN', winner: role });
        } else {
          playTone(200, 'sawtooth', 0.1);
        }
      };

      const next = () => {
        setWinner(null);
        setInput('');
        setIdx(i => i + 1);
      };

      return (
        <div className="bg-slate-900 border border-slate-800 p-8 rounded-3xl max-w-md mx-auto text-center space-y-6 shadow-2xl">
          <span className="text-[11px] font-black uppercase tracking-widest text-indigo-400">Word #{idx + 1} of {SCRAMBLE_WORDS.length}</span>
          
          <div className="p-6 bg-slate-950 rounded-2xl border border-slate-800">
            <div className="text-4xl font-mono font-black tracking-widest text-emerald-400">{scrambled}</div>
            <div className="text-xs text-slate-400 mt-3 italic">Hint: {cur.hint}</div>
          </div>

          {!winner ? (
            <form onSubmit={handleSubmit} className="flex gap-2">
              <input 
                type="text"
                placeholder="TYPE UNSCRAMBLED WORD..."
                value={input}
                onChange={(e) => setInput(e.target.value.toUpperCase())}
                className="flex-1 bg-slate-950 border border-slate-800 rounded-2xl px-4 py-3.5 font-mono font-bold uppercase focus:outline-none focus:border-indigo-500"
              />
              <button 
                type="submit"
                className="px-6 bg-indigo-600 hover:bg-indigo-500 font-bold rounded-2xl shadow-lg"
              >
                Submit
              </button>
            </form>
          ) : (
            <div className="space-y-4">
              <div className="text-xl font-bold text-white">
                Answer: <span className="text-emerald-400 font-mono font-black">{cur.word}</span>
              </div>
              <div className="text-sm font-semibold text-indigo-400">
                {winner === role ? "🏆 Solved first by you!" : "Opponent unscrambled it first!"}
              </div>
              <button 
                onClick={() => { next(); sendData({ type: 'SCRAMBLE_NEXT' }); }}
                className="w-full py-3 bg-indigo-600 hover:bg-indigo-500 rounded-2xl font-bold shadow-lg"
              >
                Next Word →
              </button>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 9. TUG OF WAR
    // ==========================================
    function TugOfWar({ role, sendData, connRef, addPoint }) {
      const [pos, setPos] = useState(0);
      const [winner, setWinner] = useState(null);

      useEffect(() => {
        if (!connRef.current) return;
        connRef.current.on('data', (d) => {
          if (d.type === 'TUG_PULL') applyPull(d.delta);
          else if (d.type === 'TUG_RESET') { setPos(0); setWinner(null); }
        });
      }, [pos, winner]);

      const applyPull = (delta) => {
        if (winner) return;
        setPos(p => {
          const next = p + delta;
          if (next <= -40) {
            setWinner('host');
            addPoint('host');
          } else if (next >= 40) {
            setWinner('guest');
            addPoint('guest');
          }
          return next;
        });
        playTone(320 + Math.abs(pos) * 6, 'triangle', 0.05);
      };

      const pull = () => {
        if (winner) return;
        const delta = (role === 'host' || role === 'solo') ? -3 : 3;
        applyPull(delta);
        sendData({ type: 'TUG_PULL', delta });
      };

      return (
        <div className="bg-slate-900 border border-slate-800 p-8 rounded-3xl max-w-lg mx-auto text-center space-y-6 shadow-2xl">
          <div>
            <h3 className="text-2xl font-black">Button-Mashing Tug of War</h3>
            <p className="text-xs text-slate-400 mt-1">Mash the button as fast as possible!</p>
          </div>

          <div className="relative h-14 bg-slate-950 rounded-2xl border border-slate-800 flex items-center px-4 overflow-hidden">
            <div className="absolute left-1/2 top-0 bottom-0 w-0.5 bg-rose-500/50"></div>
            <div 
              className="absolute w-9 h-9 rounded-full bg-gradient-to-tr from-amber-400 to-orange-500 shadow-xl shadow-orange-500/50 -translate-x-1/2 transition-all duration-75 flex items-center justify-center font-black text-sm"
              style={{ left: `${50 + pos}%` }}
            >
              🪢
            </div>
          </div>

          <div className="flex justify-between text-xs font-bold text-slate-400">
            <span>← Player 1 Goal</span>
            <span>Player 2 Goal →</span>
          </div>

          {!winner ? (
            <button 
              onClick={pull}
              className="w-full py-8 bg-gradient-to-r from-indigo-600 to-indigo-500 active:scale-95 text-3xl font-black rounded-3xl shadow-xl shadow-indigo-600/30 uppercase tracking-widest transition select-none"
            >
              PULL! 💥
            </button>
          ) : (
            <div className="space-y-4">
              <div className="text-2xl font-black text-emerald-400">
                {winner.toUpperCase()} PULLED THE WIN!
              </div>
              <button 
                onClick={() => { setPos(0); setWinner(null); sendData({ type: 'TUG_RESET' }); }}
                className="px-6 py-2.5 bg-indigo-600 rounded-xl font-bold text-sm shadow-lg"
              >
                Rematch
              </button>
            </div>
          )}
        </div>
      );
    }

    // Mount Application
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
