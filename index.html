    // --- SYNTHESIZED SOUND EFFECTS ---
    const playTone = (freq = 440, type = 'sine', duration = 0.1) => {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    };

    // --- HAVERSINE GREAT-CIRCLE DISTANCE CALCULATOR (KM) ---
    function getDistanceKm(x1, y1, x2, y2) {
      const toRad = (d) => (d * Math.PI) / 180;
      const lon1 = (x1 / 100) * 360 - 180;
      const lat1 = 90 - (y1 / 100) * 180;
      const lon2 = (x2 / 100) * 360 - 180;
      const lat2 = 90 - (y2 / 100) * 180;
      const R = 6371;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a = Math.sin(dLat / 2) ** 2 +
                Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return Math.round(R * c);
    }

    // --- BULLETPROOF IMAGE COMPONENT (Bypasses w.wiki/GHai & Hotlink Blocks) ---
    function ProxyImage({ file, alt, className }) {
      const getSources = (fn) => {
        if (!fn) return [];
        if (fn.startsWith('http')) {
          const encoded = encodeURIComponent(fn);
          return [
            `https://wsrv.nl/?url=${encoded}&w=800&output=jpg`,
            fn
          ];
        }
        const cleanFn = encodeURIComponent(fn);
        return [
          // 1. Cloudflare wsrv.nl proxy requesting raw full file (never triggers thumbnail size restrictions)
          `https://wsrv.nl/?url=https://commons.wikimedia.org/wiki/Special:FilePath/${cleanFn}&w=800&output=jpg`,
          // 2. Secondary weserv mirror
          `https://images.weserv.nl/?url=https://commons.wikimedia.org/wiki/Special:FilePath/${cleanFn}&w=800&output=jpg`,
          // 3. Direct Wikimedia Special:FilePath with standard 640px tier
          `https://commons.wikimedia.org/wiki/Special:FilePath/${cleanFn}?width=640`
        ];
      };

      const sources = getSources(file);
      const [index, setIndex] = useState(0);

      useEffect(() => {
        setIndex(0);
      }, [file]);

      const handleError = () => {
        if (index < sources.length - 1) {
          setIndex(i => i + 1);
        }
      };

      return (
        <img 
          src={sources[index]} 
          alt={alt}
          onError={handleError}
          className={className}
          loading="eager"
        />
      );
    }
